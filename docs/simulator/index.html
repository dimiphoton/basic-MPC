<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chauffer avant — leçon RC</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
  <header>
    <div>
      <p class="nav" id="nav"></p>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <button class="lang" id="langBtn" type="button">EN</button>
  </header>
  <main>
    <section class="card" id="rc">
      <h2 id="rcTitle"></h2>
      <p id="rcBody"></p>
      <p class="eq">R = isolation (fuite vers l’extérieur) · C = masse (murs, dalle)</p>
      <p class="hint" id="rcHint"></p>
    </section>

    <section class="card" id="family">
      <h2 id="famTitle"></h2>
      <p id="famBody"></p>
      <figure>
        <img src="img/schema-r1c1.png" alt="R1C1" />
        <figcaption id="capR1"></figcaption>
      </figure>
      <figure>
        <img src="img/schema-r2c2.png" alt="R2C2" />
        <figcaption id="capR2"></figcaption>
      </figure>
      <figure>
        <img src="img/schema-plant.png" alt="Plant" />
        <figcaption id="capPlant"></figcaption>
      </figure>
    </section>

    <section class="card" id="sensor">
      <h2 id="sensorTitle"></h2>
      <p id="sensorBody"></p>
      <p class="eq">y = T_air + v &nbsp;·&nbsp; salon 0,1 °C &nbsp;·&nbsp; extérieur 1 °C</p>
      <p class="hint" id="sensorHint"></p>
    </section>

    <section class="card" id="kalman">
      <h2 id="kalmanTitle"></h2>
      <p id="kalmanBody"></p>
      <figure>
        <img src="img/schema-kalman.png" alt="Kalman" />
        <figcaption id="capKalman"></figcaption>
      </figure>
      <p class="hint" id="kalmanHint"></p>
    </section>

    <section class="card" id="phase">
      <h2 id="phaseTitle"></h2>
      <p id="phaseBody"></p>
      <label id="massLabel" for="mass"></label>
      <input id="mass" type="range" min="0.25" max="4" step="0.05" value="1" />
      <p class="delay" id="delayReadout">—</p>
      <div id="phaseChart" class="chart"></div>
    </section>

    <section class="card" id="lab">
      <h2 id="labTitle"></h2>
      <p id="labBody"></p>
      <pre class="eq">pip install -e ".[sim]"
streamlit run webapp/app.py</pre>
    </section>

    <div class="row">
      <section class="card">
        <h2 id="zTitle"></h2>
        <p id="zBody"></p>
        <div id="zChart" class="chart chart-sm"></div>
      </section>
      <section class="card">
        <h2 id="bodeTitle"></h2>
        <p id="bodeBody"></p>
        <div id="bodeChart" class="chart chart-sm"></div>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
